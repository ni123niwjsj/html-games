<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>玫瑰打砖块 - Fairy Rose Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(255,79,163,.25),transparent 28rem),#080913;color:#fff7fb;font-family:"Microsoft YaHei",Arial,sans-serif;display:grid;place-items:center;padding:14px}.wrap{width:min(860px,100%)}header,.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0}a,button{border:1px solid rgba(255,142,200,.45);border-radius:8px;background:rgba(255,79,163,.16);color:#fff;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}.stat{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08)}canvas{display:block;width:100%;aspect-ratio:4/3;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#0d1020;touch-action:none;box-shadow:0 24px 70px rgba(0,0,0,.4)}.hint{color:#b7a9bb;line-height:1.7}
  </style>
</head>
<body>
  <main class="wrap">
    <header><h1>玫瑰打砖块</h1><a href="../../index.html">返回大厅</a></header>
    <section class="bar"><span class="stat">分数：<b id="score">0</b></span><span class="stat">最高分：<b id="best">0</b></span><span class="stat">关卡：<b id="level">1</b></span><span class="stat">生命：<b id="lives">3</b></span><button id="restart">重新开始</button></section>
    <canvas id="game" width="800" height="600"></canvas>
    <p class="hint">键盘左右键、鼠标或触控移动挡板。粉色道具加宽挡板，蓝色道具多球，黄色道具让球短时间变成激光球。</p>
  </main>
  <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),levelEl=document.getElementById("level"),livesEl=document.getElementById("lives"),key="breakout_high_score";
    let score=0,best=Number(localStorage.getItem(key)||0),level=1,lives=3,paddle,balls,bricks,powers,keys={},laserTime=0,running=true,loopStarted=false;bestEl.textContent=best;
    function reset(){score=0;level=1;lives=3;setup();if(!loopStarted){loopStarted=true;loop()}}
    function setup(){running=true;paddle={x:340,y:555,w:120,h:16};balls=[{x:400,y:520,vx:4,vy:-5,r:8}];powers=[];laserTime=0;makeBricks();sync()}
    function makeBricks(){bricks=[];const rows=4+Math.min(level,4),cols=10,w=68,h=24,ox=47,oy=60;for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)bricks.push({x:ox+x*(w+8),y:oy+y*(h+8),w,h,hp:1+Math.floor(level/3),c:["#ff4fa3","#57e6ff","#ffe071","#8cffb0"][y%4]})}
    function sync(){scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem(key,best)}bestEl.textContent=best;levelEl.textContent=level;livesEl.textContent=lives}
    function update(){if(keys.ArrowLeft||keys.a)paddle.x-=8;if(keys.ArrowRight||keys.d)paddle.x+=8;paddle.x=Math.max(0,Math.min(800-paddle.w,paddle.x));laserTime=Math.max(0,laserTime-1);balls.forEach(b=>{b.x+=b.vx;b.y+=b.vy;if(b.x<b.r||b.x>800-b.r)b.vx*=-1;if(b.y<b.r)b.vy*=-1;if(b.y>620)b.dead=true;if(b.x>paddle.x&&b.x<paddle.x+paddle.w&&b.y+b.r>paddle.y&&b.y-b.r<paddle.y+paddle.h){b.vy=-Math.abs(b.vy);b.vx+=(b.x-(paddle.x+paddle.w/2))/22}bricks.forEach(br=>{if(br.hp>0&&b.x>br.x&&b.x<br.x+br.w&&b.y-b.r<br.y+br.h&&b.y+b.r>br.y){if(!laserTime)b.vy*=-1;br.hp--;score+=10;if(br.hp<=0&&Math.random()<.18)powers.push({x:br.x+br.w/2,y:br.y,type:["wide","multi","laser"][Math.floor(Math.random()*3)]})}})});balls=balls.filter(b=>!b.dead);if(!balls.length){lives--;balls=[{x:paddle.x+paddle.w/2,y:520,vx:4,vy:-5,r:8}]}powers.forEach(p=>p.y+=3);powers.forEach(p=>{if(p.y>paddle.y&&p.x>paddle.x&&p.x<paddle.x+paddle.w){p.hit=true;if(p.type==="wide")paddle.w=Math.min(210,paddle.w+38);if(p.type==="multi")balls.push(...balls.map(b=>({x:b.x,y:b.y,vx:-b.vx,vy:b.vy,r:b.r})));if(p.type==="laser")laserTime=420;score+=25}});powers=powers.filter(p=>!p.hit&&p.y<610);if(lives<=0){running=false}if(bricks.every(b=>b.hp<=0)){level++;setup()}sync()}
    function draw(){ctx.clearRect(0,0,800,600);ctx.fillStyle="#10162b";ctx.fillRect(0,0,800,600);bricks.forEach(b=>{if(b.hp>0){ctx.fillStyle=b.c;round(b.x,b.y,b.w,b.h,6);ctx.fill();ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(b.x+6,b.y+5,b.w-12,3)}});ctx.fillStyle="#ff8ec8";round(paddle.x,paddle.y,paddle.w,paddle.h,8);ctx.fill();balls.forEach(b=>{ctx.fillStyle=laserTime?"#ffe071":"#57e6ff";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(laserTime){ctx.strokeStyle="rgba(255,224,113,.55)";ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x,b.y-80);ctx.stroke()}});powers.forEach(p=>{ctx.fillStyle=p.type==="wide"?"#ff4fa3":p.type==="multi"?"#57e6ff":"#ffe071";ctx.fillRect(p.x-10,p.y-10,20,20)});if(!running){ctx.fillStyle="rgba(0,0,0,.62)";ctx.fillRect(0,0,800,600);ctx.fillStyle="#fff";ctx.font="38px Microsoft YaHei";ctx.textAlign="center";ctx.fillText("游戏结束",400,285)}}
    function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
    function loop(){running=true;function frame(){if(running)update();draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)}
    document.addEventListener("keydown",e=>keys[e.key]=true);document.addEventListener("keyup",e=>keys[e.key]=false);function move(clientX){const r=canvas.getBoundingClientRect();paddle.x=(clientX-r.left)/r.width*800-paddle.w/2}canvas.addEventListener("mousemove",e=>move(e.clientX));canvas.addEventListener("touchmove",e=>{e.preventDefault();move(e.touches[0].clientX)},{passive:false});document.getElementById("restart").onclick=reset;reset();
  </script>
</body>
</html>
