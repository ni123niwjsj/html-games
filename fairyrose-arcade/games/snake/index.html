<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>霓虹贪吃蛇 - Fairy Rose Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,rgba(255,79,163,.28),transparent 28rem),#080913;color:#fff7fb;font-family:"Microsoft YaHei",Arial,sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(760px,100%)}header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}a,button{border:1px solid rgba(255,142,200,.45);border-radius:8px;background:rgba(255,79,163,.15);color:#fff;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}button.active{box-shadow:0 0 18px rgba(255,79,163,.45);background:rgba(255,79,163,.34)}h1{margin:0;font-size:28px}.panel{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.stat{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08)}canvas{display:block;width:100%;aspect-ratio:1;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#0d1020;box-shadow:0 24px 70px rgba(0,0,0,.4);touch-action:none}.hint{color:#b7a9bb;line-height:1.7}.pad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;justify-content:center;margin-top:14px}.pad button{height:48px;padding:0}@media (min-width:700px){.pad{display:none}}
  </style>
</head>
<body>
  <main class="wrap">
    <header><h1>霓虹贪吃蛇</h1><a href="../../index.html">返回大厅</a></header>
    <section class="panel">
      <span class="stat">分数：<b id="score">0</b></span>
      <span class="stat">最高分：<b id="best">0</b></span>
      <button id="normal" class="active">普通模式</button>
      <button id="fast">加速模式</button>
      <button id="restart">重新开始</button>
    </section>
    <canvas id="game" width="560" height="560"></canvas>
    <p class="hint">键盘方向键或 WASD 控制方向，手机滑动也可以操作。吃到玫瑰能量会变长，撞墙或撞到自己则游戏结束。</p>
    <div class="pad"><span></span><button data-dir="up">↑</button><span></span><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div>
  </main>
  <script>
    const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
    const key="snake_high_score";let best=Number(localStorage.getItem(key)||0),score=0,snake,food,dir,nextDir,timer,speed=125,alive=true,fast=false;
    bestEl.textContent=best;
    function reset(){score=0;snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};nextDir=dir;alive=true;placeFood();scoreEl.textContent=0;clearInterval(timer);timer=setInterval(tick,speed);draw()}
    function placeFood(){do{food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
    function setDir(name){const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=map[name];if(n&&n.x+dir.x!==0&&n.y+dir.y!==0)nextDir=n}
    function tick(){if(!alive)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(head.x<0||head.y<0||head.x>=20||head.y>=20||snake.some(p=>p.x===head.x&&p.y===head.y)){alive=false;draw();return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score+=fast?15:10;if(score>best){best=score;localStorage.setItem(key,best)}scoreEl.textContent=score;bestEl.textContent=best;placeFood()}else snake.pop();draw()}
    function draw(){ctx.clearRect(0,0,560,560);ctx.fillStyle="#11162a";ctx.fillRect(0,0,560,560);for(let i=0;i<20;i++){ctx.strokeStyle="rgba(255,255,255,.05)";ctx.beginPath();ctx.moveTo(i*28,0);ctx.lineTo(i*28,560);ctx.moveTo(0,i*28);ctx.lineTo(560,i*28);ctx.stroke()}snake.forEach((p,i)=>{ctx.fillStyle=i?"#57e6ff":"#ff4fa3";round(p.x*28+3,p.y*28+3,22,22,6);ctx.fill()});ctx.fillStyle="#ffe071";ctx.beginPath();ctx.arc(food.x*28+14,food.y*28+14,10,0,Math.PI*2);ctx.fill();if(!alive){ctx.fillStyle="rgba(0,0,0,.58)";ctx.fillRect(0,0,560,560);ctx.fillStyle="#fff";ctx.font="34px Microsoft YaHei";ctx.textAlign="center";ctx.fillText("游戏结束",280,260);ctx.font="18px Microsoft YaHei";ctx.fillText("点击重新开始再来一局",280,300)}}
    function round(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
    document.addEventListener("keydown",e=>{if(["ArrowUp","w","W"].includes(e.key))setDir("up");if(["ArrowDown","s","S"].includes(e.key))setDir("down");if(["ArrowLeft","a","A"].includes(e.key))setDir("left");if(["ArrowRight","d","D"].includes(e.key))setDir("right")});
    let sx=0,sy=0;canvas.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});canvas.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))});
    document.querySelectorAll("[data-dir]").forEach(b=>b.onclick=()=>setDir(b.dataset.dir));
    const normalBtn=document.getElementById("normal"),fastBtn=document.getElementById("fast");
    document.getElementById("restart").onclick=reset;normalBtn.onclick=()=>{fast=false;speed=125;normalBtn.classList.add("active");fastBtn.classList.remove("active");reset()};fastBtn.onclick=()=>{fast=true;speed=78;fastBtn.classList.add("active");normalBtn.classList.remove("active");reset()};reset();
  </script>
</body>
</html>
