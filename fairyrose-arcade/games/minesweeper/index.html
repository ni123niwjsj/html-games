<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>星尘扫雷 - Fairy Rose Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 8%,rgba(255,79,163,.24),transparent 28rem),#080913;color:#fff7fb;font-family:"Microsoft YaHei",Arial,sans-serif;display:grid;place-items:center;padding:14px}.wrap{width:min(900px,100%)}header,.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0}a,button{border:1px solid rgba(255,142,200,.45);border-radius:8px;background:rgba(255,79,163,.16);color:#fff;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}button.active{background:rgba(255,79,163,.36);box-shadow:0 0 18px rgba(255,79,163,.32)}.stat{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08)}.board{display:grid;gap:4px;max-width:100%;margin:auto;touch-action:none}.cell{width:min(42px,8.5vw);aspect-ratio:1;border:1px solid rgba(255,255,255,.13);border-radius:6px;background:linear-gradient(135deg,rgba(255,79,163,.2),rgba(87,230,255,.12));color:#fff;font-weight:800;font-size:clamp(14px,4vw,21px);display:grid;place-items:center;user-select:none}.cell.open{background:rgba(255,255,255,.09);box-shadow:inset 0 0 14px rgba(0,0,0,.3)}.cell.flag{color:#ffe071}.cell.mine{background:#c7376d}.hint{color:#b7a9bb;line-height:1.7;text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <header><h1>星尘扫雷</h1><a href="../../index.html">返回大厅</a></header>
    <section class="bar">
      <span class="stat">用时：<b id="time">0</b> 秒</span><span class="stat">剩余雷：<b id="left">0</b></span><span class="stat">状态：<b id="status">准备</b></span><span class="stat">最佳：<b id="best">暂无</b></span>
      <button data-level="easy" class="active">简单</button><button data-level="normal">中等</button><button data-level="hard">困难</button><button id="restart">重新开始</button>
    </section>
    <section id="board" class="board"></section>
    <p class="hint">左键点击翻开格子，右键或手机长按插旗。第一下不会踩雷。</p>
  </main>
  <script>
    const levels={easy:{w:9,h:9,m:10},normal:{w:14,h:14,m:35},hard:{w:18,h:14,m:48}},key="minesweeper_best_time";
    const boardEl=document.getElementById("board"),timeEl=document.getElementById("time"),leftEl=document.getElementById("left"),statusEl=document.getElementById("status"),bestEl=document.getElementById("best");
    let level="easy",cfg,grid,started=false,over=false,first=true,timer=null,seconds=0,flags=0,best=localStorage.getItem(key);bestEl.textContent=best?best+" 秒":"暂无";
    function reset(){cfg=levels[level];grid=Array.from({length:cfg.h},(_,y)=>Array.from({length:cfg.w},(_,x)=>({x,y,mine:false,open:false,flag:false,n:0})));started=false;over=false;first=true;seconds=0;flags=0;clearInterval(timer);timeEl.textContent=0;leftEl.textContent=cfg.m;statusEl.textContent="准备";boardEl.style.gridTemplateColumns=`repeat(${cfg.w}, 1fr)`;render()}
    function plant(safeX,safeY){let placed=0;while(placed<cfg.m){const x=Math.floor(Math.random()*cfg.w),y=Math.floor(Math.random()*cfg.h),c=grid[y][x];if(c.mine||(Math.abs(x-safeX)<=1&&Math.abs(y-safeY)<=1))continue;c.mine=true;placed++}for(let y=0;y<cfg.h;y++)for(let x=0;x<cfg.w;x++){grid[y][x].n=neighbors(x,y).filter(c=>c.mine).length}}
    function neighbors(x,y){const arr=[];for(let yy=y-1;yy<=y+1;yy++)for(let xx=x-1;xx<=x+1;xx++)if(!(xx===x&&yy===y)&&grid[yy]&&grid[yy][xx])arr.push(grid[yy][xx]);return arr}
    function startClock(){if(started)return;started=true;timer=setInterval(()=>{seconds++;timeEl.textContent=seconds},1000)}
    function openCell(c){if(over||c.flag||c.open)return;if(first){plant(c.x,c.y);first=false}startClock();c.open=true;if(c.mine){lose();return}if(!c.n)neighbors(c.x,c.y).forEach(openCell);checkWin();render()}
    function toggleFlag(c){if(over||c.open)return;c.flag=!c.flag;flags+=c.flag?1:-1;leftEl.textContent=cfg.m-flags;render()}
    function lose(){over=true;clearInterval(timer);statusEl.textContent="失败";grid.flat().forEach(c=>{if(c.mine)c.open=true})}
    function checkWin(){const opened=grid.flat().filter(c=>c.open).length;if(opened===cfg.w*cfg.h-cfg.m){over=true;clearInterval(timer);statusEl.textContent="胜利";if(!best||seconds<Number(best)){best=seconds;localStorage.setItem(key,best);bestEl.textContent=best+" 秒"}}}
    function render(){boardEl.innerHTML="";grid.flat().forEach(c=>{const d=document.createElement("button");d.className="cell"+(c.open?" open":"")+(c.flag?" flag":"")+(c.open&&c.mine?" mine":"");d.textContent=c.open?(c.mine?"✹":(c.n||"")):(c.flag?"⚑":"");d.oncontextmenu=e=>{e.preventDefault();toggleFlag(c)};let press;d.addEventListener("pointerdown",()=>{press=setTimeout(()=>toggleFlag(c),520)});d.addEventListener("pointerup",()=>clearTimeout(press));d.addEventListener("pointerleave",()=>clearTimeout(press));d.onclick=()=>openCell(c);boardEl.appendChild(d)})}
    document.querySelectorAll("[data-level]").forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll("[data-level]").forEach(x=>x.classList.toggle("active",x===b));reset()});document.getElementById("restart").onclick=reset;reset();
  </script>
</body>
</html>
