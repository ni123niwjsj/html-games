<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>玫瑰坦克对决 - Fairy Rose Arcade</title>
  <style>
    :root{color-scheme:dark;--bg:#080913;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--text:#fff7fb;--muted:#b7a9bb;--rose:#ff4fa3;--cyan:#57e6ff;--yellow:#ffe071;--green:#8cffb0}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;overflow:hidden;background:radial-gradient(circle at 12% 8%,rgba(255,79,163,.24),transparent 25rem),radial-gradient(circle at 88% 20%,rgba(87,230,255,.18),transparent 22rem),var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;touch-action:none;user-select:none}
    button,input{font:inherit}
    a,button{border:1px solid rgba(255,142,200,.42);border-radius:8px;background:linear-gradient(135deg,rgba(255,79,163,.2),rgba(87,230,255,.1));color:#fff;text-decoration:none;cursor:pointer}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px}
    button{min-height:42px;padding:0 15px}
    button.primary{background:linear-gradient(135deg,rgba(255,79,163,.45),rgba(87,230,255,.2));box-shadow:0 0 24px rgba(255,79,163,.25)}
    .app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:12px;gap:10px}
    .topbar,.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    h1{margin:0;font-size:22px;letter-spacing:0}.status{color:var(--muted);font-size:14px}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
    .stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:8px;background:rgba(8,9,19,.72);box-shadow:0 24px 70px rgba(0,0,0,.38);overflow:hidden}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:18px;background:rgba(8,9,19,.72);backdrop-filter:blur(16px)}
    .card{width:min(520px,100%);padding:22px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.06));box-shadow:0 24px 70px rgba(0,0,0,.38)}
    .card h2{margin:0 0 10px;font-size:28px}.card p{margin:0 0 16px;color:var(--muted);line-height:1.65}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.field{display:grid;gap:6px;flex:1 1 190px;color:var(--muted);font-size:13px}
    input{width:100%;height:42px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(0,0,0,.28);color:#fff;padding:0 12px;outline:none;text-transform:uppercase}
    .mobile-controls{position:absolute;inset:auto 0 0;display:none;justify-content:space-between;align-items:flex-end;padding:18px;pointer-events:none}
    .stick{position:relative;width:132px;height:132px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:rgba(255,255,255,.07);pointer-events:auto}
    .knob{position:absolute;left:42px;top:42px;width:48px;height:48px;border-radius:50%;background:rgba(87,230,255,.72);box-shadow:0 0 24px rgba(87,230,255,.38)}
    .fire{width:112px;height:112px;border-radius:50%;background:rgba(255,79,163,.32);font-weight:800;pointer-events:auto}
    .portrait-tip{display:none;position:absolute;inset:0;z-index:4;place-items:center;text-align:center;padding:24px;background:rgba(8,9,19,.86);backdrop-filter:blur(12px)}
    .toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.48);color:#fff;opacity:0;transition:.18s}
    .toast.show{opacity:1}
    @media (pointer:coarse){.mobile-controls{display:flex}.hud{font-size:13px}.app{padding:8px}.topbar a{min-height:36px}.topbar h1{font-size:18px}}
    @media (orientation:portrait) and (pointer:coarse){.portrait-tip{display:grid}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>玫瑰坦克对决</h1>
        <div id="status" class="status">准备连接</div>
      </div>
      <div class="row">
        <button id="openMenu">房间</button>
        <a href="../../index.html">返回大厅</a>
      </div>
    </header>

    <section class="stage">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="toast" class="toast"></div>
      <div class="portrait-tip">
        <div>
          <h2>请横屏游玩</h2>
          <p>横屏时会显示更完整的战场和双摇杆操作。</p>
        </div>
      </div>
      <div class="mobile-controls">
        <div id="stick" class="stick"><div id="knob" class="knob"></div></div>
        <button id="fireTouch" class="fire">开火</button>
      </div>
      <div id="menu" class="overlay">
        <section class="card">
          <h2>在线双人坦克战</h2>
          <p>创建 6 位房间码，邀请朋友加入。服务端负责坦克、炮弹和比分同步，先到 5 分获胜。</p>
          <div class="row">
            <label class="field">Worker 地址
              <input id="serverInput" placeholder="例如 https://你的-worker.workers.dev">
            </label>
          </div>
          <div class="row">
            <button id="createRoom" class="primary">创建房间</button>
            <label class="field">加入房间码
              <input id="roomInput" maxlength="6" placeholder="ABC123">
            </label>
            <button id="joinRoom">加入房间</button>
          </div>
          <div class="row">
            <span class="pill">当前房间：<b id="roomLabel">暂无</b></span>
            <button id="copyInvite">复制邀请链接</button>
            <button id="restartMatch">再来一局</button>
          </div>
          <p>桌面端：A/D 或 ←/→ 旋转，W/S 或 ↑/↓ 前进后退，空格开火。移动端：横屏左摇杆移动/转向，右侧按钮开火。</p>
        </section>
      </div>
    </section>

    <footer class="hud">
      <span class="pill">你是：<b id="seat">未加入</b></span>
      <span class="pill">粉队 <b id="p1Score">0</b> : <b id="p2Score">0</b> 蓝队</span>
      <span class="pill">目标：先到 5 分</span>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const menu = document.getElementById("menu");
    const serverInput = document.getElementById("serverInput");
    const roomInput = document.getElementById("roomInput");
    const roomLabel = document.getElementById("roomLabel");
    const seatEl = document.getElementById("seat");
    const p1Score = document.getElementById("p1Score");
    const p2Score = document.getElementById("p2Score");
    const toast = document.getElementById("toast");
    const stick = document.getElementById("stick");
    const knob = document.getElementById("knob");
    const fireTouch = document.getElementById("fireTouch");

    const clientId = localStorage.getItem("tank_duel_player_id") || crypto.randomUUID();
    localStorage.setItem("tank_duel_player_id", clientId);

    let ws = null;
    let roomCode = "";
    let mySeat = "";
    let snapshot = null;
    let keys = {};
    let input = { turn: 0, move: 0, fire: false };
    let lastInput = "";
    let reconnectTimer = null;
    let lastFinishKey = "";
    let serverBase = localStorage.getItem("tank_duel_server") || defaultServerBase();

    serverInput.value = serverBase;
    hydrateFromUrl();
    drawEmpty();
    setInterval(sendInput, 50);

    function defaultServerBase() {
      if (location.protocol === "file:") return "http://127.0.0.1:8787";
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return "http://127.0.0.1:8787";
      return location.origin;
    }

    function hydrateFromUrl() {
      const params = new URLSearchParams(location.search);
      const server = params.get("server");
      const room = params.get("room");
      if (server) {
        serverBase = server;
        serverInput.value = server;
        localStorage.setItem("tank_duel_server", server);
      }
      if (room) {
        roomInput.value = cleanRoom(room);
        showMenu();
      }
    }

    function api(path) {
      return serverBase.replace(/\/$/, "") + path;
    }

    function wsUrl(path) {
      const url = new URL(api(path));
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      return url.toString();
    }

    async function createRoom() {
      saveServer();
      setStatus("正在创建房间...");
      const response = await fetch(api("/api/create"));
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "创建房间失败");
      roomInput.value = data.roomCode;
      connect(data.roomCode);
    }

    async function joinRoom() {
      saveServer();
      const code = cleanRoom(roomInput.value);
      if (code.length !== 6) return showToast("请输入 6 位房间码");
      connect(code);
    }

    function connect(code) {
      roomCode = cleanRoom(code);
      roomLabel.textContent = roomCode;
      localStorage.setItem("tank_duel_last_room", roomCode);
      if (ws) ws.close();
      const url = wsUrl(`/api/room/${roomCode}/websocket?playerId=${encodeURIComponent(clientId)}`);
      ws = new WebSocket(url);
      setStatus("正在连接房间 " + roomCode + "...");
      ws.addEventListener("open", () => {
        setStatus("已连接，等待对手加入");
        hideMenu();
      });
      ws.addEventListener("message", event => handleMessage(JSON.parse(event.data)));
      ws.addEventListener("close", () => {
        setStatus("连接断开，正在尝试重连...");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => roomCode && connect(roomCode), 1200);
      });
      ws.addEventListener("error", () => setStatus("连接失败，请检查 Worker 地址或房间码"));
    }

    function handleMessage(message) {
      if (message.type === "hello") {
        mySeat = message.seat;
        seatEl.textContent = mySeat === "p1" ? "粉队" : "蓝队";
      }
      if (message.type === "snapshot") {
        snapshot = message;
        p1Score.textContent = message.scores.p1;
        p2Score.textContent = message.scores.p2;
        if (message.phase === "waiting") setStatus("等待另一名玩家加入房间 " + roomCode);
        if (message.phase === "playing") setStatus("对战中：" + roomCode);
        if (message.phase === "finished") {
          setStatus((message.winner === mySeat ? "你赢了！" : "你输了") + " 点击再来一局继续。");
          recordLocalResult(message);
        }
      }
      if (message.type === "notice") showToast(message.text);
    }

    function sendInput() {
      computeKeyboardInput();
      const payload = JSON.stringify(input);
      if (!ws || ws.readyState !== WebSocket.OPEN || payload === lastInput) return;
      ws.send(JSON.stringify({ type: "input", ...input }));
      lastInput = payload;
    }

    function recordLocalResult(message) {
      if (!mySeat || !message.winner) return;
      const key = `${message.scores.p1}-${message.scores.p2}-${message.winner}`;
      if (key === lastFinishKey) return;
      lastFinishKey = key;
      const raw = localStorage.getItem("tank_duel_record");
      const record = raw ? JSON.parse(raw) : { wins: 0, losses: 0 };
      if (message.winner === mySeat) record.wins++;
      else record.losses++;
      localStorage.setItem("tank_duel_record", JSON.stringify(record));
      localStorage.setItem("tank_duel_local_stats", `胜 ${record.wins} / 负 ${record.losses}`);
    }

    function computeKeyboardInput() {
      const left = keys.ArrowLeft || keys.a || keys.A;
      const right = keys.ArrowRight || keys.d || keys.D;
      const up = keys.ArrowUp || keys.w || keys.W;
      const down = keys.ArrowDown || keys.s || keys.S;
      if (!touchingStick) {
        input.turn = (right ? 1 : 0) - (left ? 1 : 0);
        input.move = (up ? 1 : 0) - (down ? 1 : 0);
      }
      input.fire = input.fire || Boolean(keys[" "]);
    }

    function draw() {
      requestAnimationFrame(draw);
      if (!snapshot) return drawEmpty();
      const arena = snapshot.arena;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid(arena);
      snapshot.walls.forEach(drawWall);
      if (snapshot.tanks.p1) drawTank(snapshot.tanks.p1, "#ff4fa3", "粉");
      if (snapshot.tanks.p2) drawTank(snapshot.tanks.p2, "#57e6ff", "蓝");
      snapshot.bullets.forEach(drawBullet);
      drawCenterText();
    }

    function drawEmpty() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawGrid({ width: 960, height: 600 });
      ctx.fillStyle = "rgba(255,255,255,.78)";
      ctx.textAlign = "center";
      ctx.font = "28px Microsoft YaHei";
      ctx.fillText("创建或加入房间开始对战", 480, 300);
    }

    function drawGrid(arena) {
      ctx.fillStyle = "#0d1022";
      ctx.fillRect(0, 0, arena.width, arena.height);
      ctx.strokeStyle = "rgba(255,255,255,.045)";
      for (let x = 0; x <= arena.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, arena.height); ctx.stroke();
      }
      for (let y = 0; y <= arena.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(arena.width, y); ctx.stroke();
      }
    }

    function drawWall(wall) {
      ctx.fillStyle = "rgba(255,255,255,.14)";
      roundRect(wall.x, wall.y, wall.w, wall.h, 7);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,142,200,.5)";
      ctx.stroke();
    }

    function drawTank(tank, color, label) {
      ctx.save();
      ctx.translate(tank.x, tank.y);
      ctx.rotate(tank.angle);
      ctx.fillStyle = color;
      roundRect(-20, -15, 40, 30, 8);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.28)";
      ctx.fillRect(-17, -18, 34, 5);
      ctx.fillRect(-17, 13, 34, 5);
      ctx.fillStyle = "#fff";
      roundRect(0, -5, 31, 10, 4);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = color;
      ctx.font = "16px Microsoft YaHei";
      ctx.textAlign = "center";
      ctx.fillText(label, tank.x, tank.y - 28);
    }

    function drawBullet(bullet) {
      ctx.fillStyle = bullet.owner === "p1" ? "#ff8ec8" : "#8cf2ff";
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCenterText() {
      if (snapshot.phase === "waiting") {
        centerText("等待对手加入", "分享房间码 " + roomCode);
      }
      if (snapshot.phase === "finished") {
        centerText(snapshot.winner === "p1" ? "粉队获胜" : "蓝队获胜", "点击“再来一局”重新开始");
      }
    }

    function centerText(title, subtitle) {
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0, 0, 960, 600);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "34px Microsoft YaHei";
      ctx.fillText(title, 480, 285);
      ctx.font = "18px Microsoft YaHei";
      ctx.fillText(subtitle, 480, 323);
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function cleanRoom(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    }

    function saveServer() {
      serverBase = serverInput.value.trim().replace(/\/$/, "") || defaultServerBase();
      serverInput.value = serverBase;
      localStorage.setItem("tank_duel_server", serverBase);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function showMenu() { menu.style.display = "grid"; }
    function hideMenu() { menu.style.display = "none"; }

    document.getElementById("createRoom").onclick = () => createRoom().catch(error => showToast(error.message));
    document.getElementById("joinRoom").onclick = () => joinRoom().catch(error => showToast(error.message));
    document.getElementById("openMenu").onclick = showMenu;
    document.getElementById("restartMatch").onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "restart" }));
      hideMenu();
    };
    document.getElementById("copyInvite").onclick = async () => {
      if (!roomCode) return showToast("还没有房间码");
      const url = new URL(location.href);
      url.searchParams.set("room", roomCode);
      url.searchParams.set("server", serverBase);
      await navigator.clipboard.writeText(url.toString()).catch(() => {});
      showToast("邀请链接已复制");
    };
    roomInput.addEventListener("input", () => roomInput.value = cleanRoom(roomInput.value));
    document.addEventListener("keydown", e => { keys[e.key] = true; if ([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)) e.preventDefault(); });
    document.addEventListener("keyup", e => { keys[e.key] = false; if (e.key === " ") input.fire = false; });

    let touchingStick = false;
    function stickPoint(clientX, clientY) {
      const rect = stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.min(48, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      knob.style.transform = `translate(${x}px, ${y}px)`;
      input.turn = Math.max(-1, Math.min(1, x / 42));
      input.move = Math.max(-1, Math.min(1, -y / 42));
    }
    stick.addEventListener("pointerdown", e => { touchingStick = true; stick.setPointerCapture(e.pointerId); stickPoint(e.clientX, e.clientY); });
    stick.addEventListener("pointermove", e => { if (touchingStick) stickPoint(e.clientX, e.clientY); });
    stick.addEventListener("pointerup", () => { touchingStick = false; knob.style.transform = "translate(0,0)"; input.turn = 0; input.move = 0; });
    stick.addEventListener("pointercancel", () => { touchingStick = false; knob.style.transform = "translate(0,0)"; input.turn = 0; input.move = 0; });
    fireTouch.addEventListener("pointerdown", e => { fireTouch.setPointerCapture(e.pointerId); input.fire = true; });
    fireTouch.addEventListener("pointerup", () => input.fire = false);
    fireTouch.addEventListener("pointercancel", () => input.fire = false);

    draw();
  </script>
</body>
</html>
