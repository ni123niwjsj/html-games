<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>玫瑰坦克对决 - Fairy Rose Arcade</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080913;
      --panel: rgba(255, 255, 255, 0.08);
      --line: rgba(255, 255, 255, 0.16);
      --text: #fff7fb;
      --muted: #b7a9bb;
      --rose: #ff4fa3;
      --cyan: #57e6ff;
      --yellow: #ffe071;
      --green: #8cffb0;
      --danger: #ff6a55;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100dvh;
      overflow: auto;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 79, 163, 0.24), transparent 24rem),
        radial-gradient(circle at 88% 18%, rgba(87, 230, 255, 0.18), transparent 22rem),
        linear-gradient(135deg, #080913, #101225 58%, #090a13);
      touch-action: manipulation;
      user-select: none;
    }

    button, input { font: inherit; }
    a, button {
      border: 1px solid rgba(255, 142, 200, 0.42);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 79, 163, 0.2), rgba(87, 230, 255, 0.1));
      text-decoration: none;
      cursor: pointer;
    }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 14px; }
    button { min-height: 42px; padding: 0 15px; }
    button.primary { background: linear-gradient(135deg, rgba(255, 79, 163, 0.52), rgba(87, 230, 255, 0.18)); box-shadow: 0 0 24px rgba(255, 79, 163, 0.25); }

    .app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(300px, 1fr) auto;
      gap: 10px;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    .topbar, .hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
    .status { margin-top: 4px; color: var(--muted); font-size: 14px; }
    .pill { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    .stage {
      position: relative;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(8, 9, 19, 0.72);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
    }

    canvas { display: block; width: 100%; height: 100%; min-height: 300px; touch-action: none; }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      overflow: auto;
      background: rgba(8, 9, 19, 0.78);
      backdrop-filter: blur(16px);
      -webkit-overflow-scrolling: touch;
    }

    .card {
      width: min(620px, 100%);
      max-height: calc(100dvh - 32px);
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.065));
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
      -webkit-overflow-scrolling: touch;
    }
    .card h2 { margin: 0 0 10px; font-size: 28px; }
    .card p { margin: 0 0 14px; color: var(--muted); line-height: 1.65; }
    .field { display: grid; gap: 6px; flex: 1 1 220px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      outline: 0;
      padding: 0 12px;
      color: #fff;
      background: rgba(0, 0, 0, 0.28);
      text-transform: uppercase;
    }

    .mobile-controls {
      position: absolute;
      inset: auto 0 0 0;
      z-index: 5;
      display: none;
      justify-content: space-between;
      align-items: flex-end;
      padding: 16px;
      pointer-events: none;
    }
    .stick {
      position: relative;
      width: 136px;
      height: 136px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.075);
      pointer-events: auto;
      touch-action: none;
    }
    .knob {
      position: absolute;
      left: 43px;
      top: 43px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(87, 230, 255, 0.78);
      box-shadow: 0 0 24px rgba(87, 230, 255, 0.38);
    }
    .action-stack { display: grid; gap: 10px; pointer-events: auto; }
    .round-button {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      font-weight: 800;
      background: rgba(255, 79, 163, 0.34);
    }
    .power-button {
      width: 92px;
      height: 56px;
      border-radius: 12px;
      color: #15131c;
      background: rgba(255, 224, 113, 0.92);
      font-weight: 800;
    }
    .room-fab {
      min-height: 38px;
      border-radius: 999px;
      background: rgba(87, 230, 255, 0.18);
    }

    .toast {
      position: absolute;
      z-index: 7;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      max-width: min(92%, 520px);
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #fff;
      background: rgba(0, 0, 0, 0.58);
      opacity: 0;
      transition: 0.18s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .portrait-note { display: none; color: var(--yellow); }

    @media (pointer: coarse) {
      body { overflow: hidden; }
      .app { height: 100dvh; grid-template-rows: auto minmax(0, 1fr) auto; }
      .mobile-controls { display: flex; }
      .hud { font-size: 13px; }
      .topbar h1 { font-size: 18px; }
      .topbar a, .topbar button { min-height: 36px; padding: 0 11px; }
    }

    @media (orientation: portrait) and (pointer: coarse) {
      body { overflow: auto; }
      .app { min-height: 100dvh; height: auto; grid-template-rows: auto 48dvh auto; }
      .mobile-controls { display: none; }
      .portrait-note { display: block; }
      .card { max-height: none; }
    }

    @media (max-width: 720px) {
      .card { padding: 16px; }
      .card h2 { font-size: 23px; }
      .row > button, .row > a { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>玫瑰坦克对决</h1>
        <div id="status" class="status">准备连接</div>
      </div>
      <div class="row">
        <button id="openMenu">房间</button>
        <a href="../../index.html">返回大厅</a>
      </div>
    </header>

    <section class="stage">
      <canvas id="game" width="960" height="600"></canvas>
      <div id="toast" class="toast"></div>
      <div class="mobile-controls">
        <div id="stick" class="stick" aria-label="移动摇杆"><div id="knob" class="knob"></div></div>
        <div class="action-stack">
          <button id="roomFab" class="room-fab">房间</button>
          <button id="powerTouch" class="power-button">道具</button>
          <button id="fireTouch" class="round-button">开火</button>
        </div>
      </div>
      <div id="menu" class="overlay">
        <section class="card">
          <h2>在线双人坦克战</h2>
          <p>创建 6 位房间码，邀请朋友加入。击中得分，先到 5 分获胜。现在加入了爆炸、护盾、加速、散弹、地雷和穿墙弹。</p>
          <p class="portrait-note">手机竖屏也可以创建和加入房间；开始对战后建议横屏操作。</p>
          <div class="row">
            <label class="field">Worker 地址
              <input id="serverInput" autocomplete="off" placeholder="例如 https://你的-worker.workers.dev">
            </label>
          </div>
          <div class="row">
            <button id="createRoom" class="primary">创建房间</button>
            <label class="field">加入房间码
              <input id="roomInput" maxlength="6" autocomplete="off" inputmode="latin" placeholder="ABC123">
            </label>
            <button id="joinRoom">加入房间</button>
          </div>
          <div class="row">
            <span class="pill">当前房间：<b id="roomLabel">暂无</b></span>
            <button id="copyInvite">复制邀请链接</button>
            <button id="restartMatch">再来一局</button>
          </div>
          <p>桌面端：A/D 或 ←/→ 旋转，W/S 或 ↑/↓ 前进后退，空格开火，Shift 使用道具。手机端：左摇杆移动/转向，右侧按钮开火和使用道具。</p>
        </section>
      </div>
    </section>

    <footer class="hud">
      <span class="pill">你是：<b id="seat">未加入</b></span>
      <span class="pill">粉队 <b id="p1Score">0</b> : <b id="p2Score">0</b> 蓝队</span>
      <span class="pill">道具：<b id="powerLabel">无</b></span>
      <span class="pill">房间：<b id="hudRoom">暂无</b></span>
    </footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const menu = document.getElementById("menu");
    const serverInput = document.getElementById("serverInput");
    const roomInput = document.getElementById("roomInput");
    const roomLabel = document.getElementById("roomLabel");
    const hudRoom = document.getElementById("hudRoom");
    const seatEl = document.getElementById("seat");
    const p1Score = document.getElementById("p1Score");
    const p2Score = document.getElementById("p2Score");
    const powerLabel = document.getElementById("powerLabel");
    const toast = document.getElementById("toast");
    const stick = document.getElementById("stick");
    const knob = document.getElementById("knob");
    const fireTouch = document.getElementById("fireTouch");
    const powerTouch = document.getElementById("powerTouch");

    const WORKER_DEFAULT = "https://fairyrose-arcade-tank-duel.shuaigey536.workers.dev";
    const POWER_LABELS = { speed: "加速", shield: "护盾", spread: "散弹", mine: "地雷", pierce: "穿墙弹" };
    const POWER_COLORS = { speed: "#8cffb0", shield: "#57e6ff", spread: "#ff8ec8", mine: "#ff6a55", pierce: "#ffe071" };
    const clientId = localStorage.getItem("tank_duel_player_id") || crypto.randomUUID();
    localStorage.setItem("tank_duel_player_id", clientId);

    let ws = null;
    let roomCode = "";
    let mySeat = "";
    let snapshot = null;
    let keys = {};
    let input = { turn: 0, move: 0, fire: false, usePower: false };
    let lastInput = "";
    let reconnectTimer = null;
    let lastFinishKey = "";
    let serverBase = getInitialServerBase();
    let touchingStick = false;
    let seenEffects = new Set();
    let particles = [];
    let shakeUntil = 0;
    let lastFrame = performance.now();

    serverInput.value = serverBase;
    hydrateFromUrl();
    drawEmpty();
    setInterval(sendInput, 50);
    requestAnimationFrame(draw);

    function defaultServerBase() {
      if (location.protocol === "file:") return "http://127.0.0.1:8787";
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") return "http://127.0.0.1:8787";
      return WORKER_DEFAULT;
    }

    function getInitialServerBase() {
      const saved = localStorage.getItem("tank_duel_server");
      const pageOrigin = location.origin.replace(/\/$/, "");
      if (!saved || saved.replace(/\/$/, "") === pageOrigin) {
        localStorage.setItem("tank_duel_server", defaultServerBase());
        return defaultServerBase();
      }
      return saved;
    }

    function hydrateFromUrl() {
      const params = new URLSearchParams(location.search);
      const server = params.get("server");
      const room = params.get("room");
      if (server) {
        serverBase = server;
        serverInput.value = server;
        localStorage.setItem("tank_duel_server", server);
      }
      if (room) {
        roomInput.value = cleanRoom(room);
        showMenu();
      }
    }

    function api(path) {
      return serverBase.replace(/\/$/, "") + path;
    }

    function wsUrl(path) {
      const url = new URL(api(path));
      url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
      return url.toString();
    }

    async function createRoom() {
      saveServer();
      setStatus("正在创建房间...");
      const response = await fetchWithTimeout(api("/api/create"), {}, 10000);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "创建房间失败");
      roomInput.value = data.roomCode;
      connect(data.roomCode);
    }

    async function fetchWithTimeout(url, options, timeout) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeout);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (error) {
        if (error.name === "AbortError") throw new Error("创建房间超时，请检查 Worker 地址。");
        throw new Error("无法连接 Worker，请检查 Worker 地址或网络。");
      } finally {
        clearTimeout(timer);
      }
    }

    async function joinRoom() {
      saveServer();
      const code = cleanRoom(roomInput.value);
      if (code.length !== 6) return showToast("请输入 6 位房间码");
      connect(code);
    }

    function connect(code) {
      roomCode = cleanRoom(code);
      roomLabel.textContent = roomCode;
      hudRoom.textContent = roomCode;
      localStorage.setItem("tank_duel_last_room", roomCode);
      if (ws) ws.close();
      const url = wsUrl(`/api/room/${roomCode}/websocket?playerId=${encodeURIComponent(clientId)}`);
      ws = new WebSocket(url);
      setStatus("正在连接房间 " + roomCode + "...");
      ws.addEventListener("open", () => {
        setStatus("已连接，等待对手加入");
        hideMenu();
      });
      ws.addEventListener("message", event => handleMessage(JSON.parse(event.data)));
      ws.addEventListener("close", () => {
        setStatus("连接断开，正在尝试重连...");
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => roomCode && connect(roomCode), 1200);
      });
      ws.addEventListener("error", () => setStatus("连接失败，请检查 Worker 地址或房间码"));
    }

    function handleMessage(message) {
      if (message.type === "hello") {
        mySeat = message.seat;
        seatEl.textContent = mySeat === "p1" ? "粉队" : "蓝队";
      }
      if (message.type === "snapshot") {
        snapshot = message;
        processEffects(message.effects || []);
        p1Score.textContent = message.scores.p1;
        p2Score.textContent = message.scores.p2;
        const myTank = mySeat && message.tanks ? message.tanks[mySeat] : null;
        powerLabel.textContent = myTank && myTank.power ? POWER_LABELS[myTank.power] : "无";
        if (message.phase === "waiting") setStatus("等待另一名玩家加入房间 " + roomCode);
        if (message.phase === "playing") setStatus("对战中：" + roomCode);
        if (message.phase === "finished") {
          setStatus((message.winner === mySeat ? "你赢了！" : "你输了") + " 点击再来一局继续。");
          recordLocalResult(message);
        }
      }
      if (message.type === "notice") showToast(message.text);
    }

    function processEffects(effects) {
      for (const effect of effects) {
        if (seenEffects.has(effect.id)) continue;
        seenEffects.add(effect.id);
        if (seenEffects.size > 120) seenEffects = new Set([...seenEffects].slice(-80));
        if (effect.kind === "explosion") {
          spawnExplosion(effect.x, effect.y, effect.owner);
          shakeUntil = performance.now() + 240;
          showToast("命中！爆炸得分");
        } else if (effect.kind === "shieldBreak") {
          spawnBurst(effect.x, effect.y, "#57e6ff", 16);
          showToast("护盾挡下一击");
        } else if (effect.kind === "pickup") {
          spawnBurst(effect.x, effect.y, POWER_COLORS[effect.label] || "#ffe071", 12);
          showToast("获得道具：" + effect.label);
        } else if (effect.kind === "spawn") {
          spawnBurst(effect.x, effect.y, "#ffe071", 8);
        } else if (effect.kind === "spark" || effect.kind === "muzzle") {
          spawnBurst(effect.x, effect.y, effect.owner === "p1" ? "#ff8ec8" : "#8cf2ff", 6);
        }
      }
    }

    function sendInput() {
      computeKeyboardInput();
      const payload = JSON.stringify(input);
      if (!ws || ws.readyState !== WebSocket.OPEN || payload === lastInput) return;
      ws.send(JSON.stringify({ type: "input", ...input }));
      lastInput = payload;
    }

    function computeKeyboardInput() {
      const left = keys.ArrowLeft || keys.a || keys.A;
      const right = keys.ArrowRight || keys.d || keys.D;
      const up = keys.ArrowUp || keys.w || keys.W;
      const down = keys.ArrowDown || keys.s || keys.S;
      if (!touchingStick) {
        input.turn = (right ? 1 : 0) - (left ? 1 : 0);
        input.move = (up ? 1 : 0) - (down ? 1 : 0);
      }
      input.fire = input.fire || Boolean(keys[" "]);
      input.usePower = input.usePower || Boolean(keys.Shift);
    }

    function recordLocalResult(message) {
      if (!mySeat || !message.winner) return;
      const key = `${message.scores.p1}-${message.scores.p2}-${message.winner}`;
      if (key === lastFinishKey) return;
      lastFinishKey = key;
      const raw = localStorage.getItem("tank_duel_record");
      const record = raw ? JSON.parse(raw) : { wins: 0, losses: 0 };
      if (message.winner === mySeat) record.wins++;
      else record.losses++;
      localStorage.setItem("tank_duel_record", JSON.stringify(record));
      localStorage.setItem("tank_duel_local_stats", `胜 ${record.wins} / 负 ${record.losses}`);
    }

    function draw(now = performance.now()) {
      requestAnimationFrame(draw);
      const dt = Math.min(33, now - lastFrame);
      lastFrame = now;
      updateParticles(dt);
      if (!snapshot) return drawEmpty();

      ctx.save();
      if (now < shakeUntil) {
        ctx.translate((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 7);
      }
      drawGrid(snapshot.arena);
      snapshot.walls.forEach(drawWall);
      (snapshot.powerups || []).forEach(drawPowerup);
      (snapshot.mines || []).forEach(drawMine);
      (snapshot.bullets || []).forEach(drawBullet);
      if (snapshot.tanks.p1) drawTank(snapshot.tanks.p1, "#ff4fa3", "粉", "p1");
      if (snapshot.tanks.p2) drawTank(snapshot.tanks.p2, "#57e6ff", "蓝", "p2");
      drawParticles();
      drawCenterText();
      ctx.restore();
    }

    function drawEmpty() {
      drawGrid({ width: 960, height: 600 });
      ctx.fillStyle = "rgba(255,255,255,.78)";
      ctx.textAlign = "center";
      ctx.font = "28px Microsoft YaHei";
      ctx.fillText("创建或加入房间开始对战", 480, 300);
      drawParticles();
    }

    function drawGrid(arena) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0d1022";
      ctx.fillRect(0, 0, arena.width, arena.height);
      ctx.strokeStyle = "rgba(255,255,255,.045)";
      for (let x = 0; x <= arena.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, arena.height); ctx.stroke();
      }
      for (let y = 0; y <= arena.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(arena.width, y); ctx.stroke();
      }
    }

    function drawWall(wall) {
      ctx.fillStyle = "rgba(255,255,255,.14)";
      roundRect(wall.x, wall.y, wall.w, wall.h, 7);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,142,200,.52)";
      ctx.stroke();
    }

    function drawTank(tank, color, label, seat) {
      if (!tank.alive) return;
      const boosted = Date.now() < tank.speedUntil;
      ctx.save();
      ctx.translate(tank.x, tank.y);
      ctx.rotate(tank.angle);
      if (tank.shield) {
        ctx.strokeStyle = "rgba(87,230,255,.72)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 30, 0, Math.PI * 2);
        ctx.stroke();
      }
      if (boosted) {
        ctx.strokeStyle = "rgba(140,255,176,.45)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, 34, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(255,255,255,.22)";
      roundRect(-22, -20, 44, 7, 4); ctx.fill();
      roundRect(-22, 13, 44, 7, 4); ctx.fill();
      ctx.fillStyle = color;
      roundRect(-20, -15, 40, 30, 8);
      ctx.fill();
      ctx.fillStyle = "#fff";
      roundRect(0, -5, 33, 10, 4);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = color;
      ctx.font = "16px Microsoft YaHei";
      ctx.textAlign = "center";
      ctx.fillText(label, tank.x, tank.y - 32);
      if (tank.power) {
        ctx.fillStyle = POWER_COLORS[tank.power] || "#ffe071";
        ctx.font = "13px Microsoft YaHei";
        ctx.fillText(POWER_LABELS[tank.power], tank.x, tank.y + 42);
      }
      if (seat === mySeat) {
        ctx.strokeStyle = "rgba(255,255,255,.65)";
        ctx.beginPath();
        ctx.arc(tank.x, tank.y, 26, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBullet(bullet) {
      const color = bullet.kind === "pierce" ? "#ffe071" : bullet.kind === "spread" ? "#ff8ec8" : bullet.owner === "p1" ? "#ff8ec8" : "#8cf2ff";
      ctx.strokeStyle = color + "88";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bullet.x, bullet.y);
      ctx.lineTo(bullet.x - 9, bullet.y - 9);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(bullet.x, bullet.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPowerup(power) {
      const color = POWER_COLORS[power.type] || "#ffe071";
      ctx.save();
      ctx.translate(power.x, power.y);
      ctx.fillStyle = color;
      ctx.strokeStyle = "rgba(255,255,255,.75)";
      ctx.beginPath();
      ctx.arc(0, 0, 15, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = "#15131c";
      ctx.textAlign = "center";
      ctx.font = "12px Microsoft YaHei";
      ctx.fillText((POWER_LABELS[power.type] || "?").slice(0, 1), 0, 4);
      ctx.restore();
    }

    function drawMine(mine) {
      ctx.fillStyle = mine.armed ? "#ff6a55" : "rgba(255,106,85,.38)";
      ctx.beginPath();
      ctx.arc(mine.x, mine.y, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.stroke();
    }

    function drawCenterText() {
      if (!snapshot) return;
      if (snapshot.phase === "waiting") centerText("等待对手加入", "分享房间码 " + roomCode);
      if (snapshot.phase === "finished") centerText(snapshot.winner === "p1" ? "粉队获胜" : "蓝队获胜", "点击“再来一局”重新开始");
    }

    function centerText(title, subtitle) {
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fillRect(0, 0, 960, 600);
      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.font = "34px Microsoft YaHei";
      ctx.fillText(title, 480, 285);
      ctx.font = "18px Microsoft YaHei";
      ctx.fillText(subtitle, 480, 323);
    }

    function spawnExplosion(x, y, owner) {
      spawnBurst(x, y, owner === "p1" ? "#ff8ec8" : "#8cf2ff", 34);
      spawnBurst(x, y, "#ffe071", 20);
    }

    function spawnBurst(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.4 + Math.random() * 4.2;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 520 + Math.random() * 360, age: 0, color, r: 2 + Math.random() * 4 });
      }
    }

    function updateParticles(dt) {
      for (const p of particles) {
        p.age += dt;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
      }
      particles = particles.filter(p => p.age < p.life).slice(-180);
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, 1 - p.age / p.life);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * alpha, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function cleanRoom(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
    }

    function saveServer() {
      serverBase = serverInput.value.trim().replace(/\/$/, "") || defaultServerBase();
      serverInput.value = serverBase;
      localStorage.setItem("tank_duel_server", serverBase);
    }

    function setStatus(text) { statusEl.textContent = text; }
    function showMenu() { menu.style.display = "grid"; }
    function hideMenu() { menu.style.display = "none"; }
    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1900);
    }

    document.getElementById("createRoom").onclick = () => createRoom().catch(error => { setStatus("创建房间失败"); showToast(error.message); });
    document.getElementById("joinRoom").onclick = () => joinRoom().catch(error => { setStatus("加入房间失败"); showToast(error.message); });
    document.getElementById("openMenu").onclick = showMenu;
    document.getElementById("roomFab").onclick = showMenu;
    document.getElementById("restartMatch").onclick = () => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "restart" }));
      hideMenu();
    };
    document.getElementById("copyInvite").onclick = async () => {
      if (!roomCode) return showToast("还没有房间码");
      const url = new URL(location.href);
      url.searchParams.set("room", roomCode);
      url.searchParams.set("server", serverBase);
      await navigator.clipboard.writeText(url.toString()).catch(() => {});
      showToast("邀请链接已复制");
    };
    roomInput.addEventListener("input", () => roomInput.value = cleanRoom(roomInput.value));

    document.addEventListener("keydown", e => {
      keys[e.key] = true;
      if ([" ", "Shift", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
    });
    document.addEventListener("keyup", e => {
      keys[e.key] = false;
      if (e.key === " ") input.fire = false;
      if (e.key === "Shift") input.usePower = false;
    });

    function stickPoint(clientX, clientY) {
      const rect = stick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.min(49, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * dist;
      const y = Math.sin(angle) * dist;
      knob.style.transform = `translate(${x}px, ${y}px)`;
      input.turn = Math.max(-1, Math.min(1, x / 42));
      input.move = Math.max(-1, Math.min(1, -y / 42));
    }

    stick.addEventListener("pointerdown", e => { touchingStick = true; stick.setPointerCapture(e.pointerId); stickPoint(e.clientX, e.clientY); });
    stick.addEventListener("pointermove", e => { if (touchingStick) stickPoint(e.clientX, e.clientY); });
    function releaseStick() { touchingStick = false; knob.style.transform = "translate(0,0)"; input.turn = 0; input.move = 0; }
    stick.addEventListener("pointerup", releaseStick);
    stick.addEventListener("pointercancel", releaseStick);
    fireTouch.addEventListener("pointerdown", e => { fireTouch.setPointerCapture(e.pointerId); input.fire = true; });
    fireTouch.addEventListener("pointerup", () => input.fire = false);
    fireTouch.addEventListener("pointercancel", () => input.fire = false);
    powerTouch.addEventListener("pointerdown", e => { powerTouch.setPointerCapture(e.pointerId); input.usePower = true; });
    powerTouch.addEventListener("pointerup", () => input.usePower = false);
    powerTouch.addEventListener("pointercancel", () => input.usePower = false);
  </script>
</body>
</html>
