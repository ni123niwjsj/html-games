<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>玫瑰 2048 - Fairy Rose Arcade</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 8%,rgba(87,230,255,.18),transparent 25rem),#080913;color:#fff7fb;font-family:"Microsoft YaHei",Arial,sans-serif;display:grid;place-items:center;padding:16px}.wrap{width:min(620px,100%)}header,.bar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}h1{margin:0}a,button{border:1px solid rgba(255,142,200,.45);border-radius:8px;background:rgba(255,79,163,.16);color:#fff;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}.stat{padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(255,255,255,.08)}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:rgba(255,255,255,.08);touch-action:none}.cell{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:clamp(24px,9vw,48px);font-weight:800;color:#fff}.n2{background:#3a253d}.n4{background:#57304d}.n8{background:#a43f78}.n16{background:#d94e96}.n32{background:#ff4fa3}.n64{background:#ff7c6e}.n128{background:#26a7c6}.n256{background:#18b88a}.n512{background:#bd8d18}.n1024{background:#c34b4b;font-size:clamp(20px,7vw,38px)}.n2048{background:#ffe071;color:#15131c;font-size:clamp(20px,7vw,38px)}.hint{color:#b7a9bb;line-height:1.7}
  </style>
</head>
<body>
  <main class="wrap">
    <header><h1>玫瑰 2048</h1><a href="../../index.html">返回大厅</a></header>
    <section class="bar"><span class="stat">分数：<b id="score">0</b></span><span class="stat">最高分：<b id="best">0</b></span><button id="undo">撤销一步</button><button id="restart">重新开始</button></section>
    <section id="board" class="board" aria-label="2048 棋盘"></section>
    <p class="hint">使用方向键、WASD 或手机滑动移动方块。相同数字相撞会合并，目标是合成 2048。</p>
  </main>
  <script>
    const boardEl=document.getElementById("board"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),key="rose_2048_high_score";let board,score,best=Number(localStorage.getItem(key)||0),history=[];bestEl.textContent=best;
    function reset(){board=Array.from({length:4},()=>Array(4).fill(0));score=0;history=[];add();add();render()}
    function clone(){return board.map(r=>r.slice())}
    function add(){const empty=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!board[y][x])empty.push({x,y});if(empty.length){const p=empty[Math.floor(Math.random()*empty.length)];board[p.y][p.x]=Math.random()<.9?2:4}}
    function render(){boardEl.innerHTML="";board.flat().forEach(n=>{const d=document.createElement("div");d.className="cell"+(n?" n"+n:"");d.textContent=n||"";boardEl.appendChild(d)});scoreEl.textContent=score;if(score>best){best=score;localStorage.setItem(key,best)}bestEl.textContent=best;if(!moves())setTimeout(()=>alert("游戏结束，本局分数："+score),80)}
    function slide(line){let arr=line.filter(Boolean),gain=0;for(let i=0;i<arr.length-1;i++)if(arr[i]===arr[i+1]){arr[i]*=2;gain+=arr[i];arr.splice(i+1,1)}while(arr.length<4)arr.push(0);return{arr,gain}}
    function move(dir){const old=JSON.stringify(board),oldScore=score;let gain=0;if(dir==="left"||dir==="right"){for(let y=0;y<4;y++){let line=board[y].slice();if(dir==="right")line.reverse();let r=slide(line);if(dir==="right")r.arr.reverse();board[y]=r.arr;gain+=r.gain}}else{for(let x=0;x<4;x++){let line=[0,1,2,3].map(y=>board[y][x]);if(dir==="down")line.reverse();let r=slide(line);if(dir==="down")r.arr.reverse();for(let y=0;y<4;y++)board[y][x]=r.arr[y];gain+=r.gain}}if(JSON.stringify(board)!==old){history.push({board:JSON.parse(old),score:oldScore});score+=gain;add();render()}}
    function moves(){for(let y=0;y<4;y++)for(let x=0;x<4;x++){if(!board[y][x])return true;if(x<3&&board[y][x]===board[y][x+1])return true;if(y<3&&board[y][x]===board[y+1][x])return true}return false}
    document.addEventListener("keydown",e=>{const m={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down"};if(m[e.key]){e.preventDefault();move(m[e.key])}});
    let sx=0,sy=0;boardEl.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});boardEl.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});boardEl.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?"right":"left"):(dy>0?"down":"up"))});
    document.getElementById("undo").onclick=()=>{const h=history.pop();if(h){board=h.board;score=h.score;render()}};document.getElementById("restart").onclick=reset;reset();
  </script>
</body>
</html>
